# Production compose for Dokploy.
# No host ports are published: Dokploy's Traefik reaches `web` over the internal
# network, so nothing here can clash with other services on the server.
# In Dokploy, attach the domain to service `web`, container port 3000.
name: iq-web

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Data lives in a subfolder so a mount point's lost+found never blocks initdb.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Bind mount on the host: survives redeploys and can be backed up by copying the folder.
      - ${DB_DATA_DIR:-/mnt/iq-web/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      API_JWT_SECRET: ${API_JWT_SECRET:?set API_JWT_SECRET (openssl rand -base64 48)}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      CORS_ORIGINS: ${NEXT_PUBLIC_SITE_URL}
      APP_ENV: production
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
      SEPAY_BANK_ACCOUNT: ${SEPAY_BANK_ACCOUNT:-}
      SEPAY_BANK: ${SEPAY_BANK:-}
      SUBSCRIPTION_PRICE_VND: ${SUBSCRIPTION_PRICE_VND:-30000}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s  # first start runs migrations and seeds the question bank

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_ADS_ENABLED: ${NEXT_PUBLIC_ADS_ENABLED:-false}
        NEXT_PUBLIC_ADSTERRA_SRC_320X50: ${NEXT_PUBLIC_ADSTERRA_SRC_320X50:-}
        NEXT_PUBLIC_ADSTERRA_SRC_728X90: ${NEXT_PUBLIC_ADSTERRA_SRC_728X90:-}
        NEXT_PUBLIC_ADSTERRA_FRAME_URL: ${NEXT_PUBLIC_ADSTERRA_FRAME_URL:-}
        NEXT_PUBLIC_ADSTERRA_POPUNDER_SRC: ${NEXT_PUBLIC_ADSTERRA_POPUNDER_SRC:-}
        NEXT_PUBLIC_ADSTERRA_POPUNDER_EVERY_HOURS: ${NEXT_PUBLIC_ADSTERRA_POPUNDER_EVERY_HOURS:-48}
        NEXT_PUBLIC_ADSTERRA_POPUNDER_FROM_PAGEVIEW: ${NEXT_PUBLIC_ADSTERRA_POPUNDER_FROM_PAGEVIEW:-2}
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -base64 48)}
      AUTH_URL: ${NEXT_PUBLIC_SITE_URL}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      API_JWT_SECRET: ${API_JWT_SECRET:?set API_JWT_SECRET (openssl rand -base64 48)}
      API_INTERNAL_URL: http://api:8000
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

