# Local dev: databases and API in Docker on non-default host ports.
#   docker compose -f docker-compose.dev.yml up -d
#   cd web && npm run dev -- -p ${WEB_PORT:-34817}
name: iq-web-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iq
      POSTGRES_PASSWORD: iq
      POSTGRES_DB: iq
    ports:
      - "${DB_PORT:-45329}:5432"
    volumes:
      - db-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iq -d iq"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://iq:iq@db:5432/iq
      API_JWT_SECRET: ${API_JWT_SECRET:-dev-secret}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-34817}
    volumes:
      - ./api/app:/app/app
      - ./api/alembic:/app/alembic
    ports:
      - "${API_PORT:-38721}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-dev:
